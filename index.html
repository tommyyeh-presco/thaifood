  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #9b7b4f;
      --gold-light: #c4a87a;
      --gold-dark: #7a5f3a;
      --gold-bg: #faf6f0;
      --bg: #fff;
      --text: #2d2820;
      --text-light: #8a7e72;
      --border: #e8e0d4;
      --selected-bg: #fdf8f0;
      --accent: #c4710a;
      --preorder: #b85c2f;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--gold-bg);
      color: var(--text);
      padding-bottom: 100px;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: linear-gradient(135deg, #2a1e14 0%, #3d2b1f 40%, #4a3428 100%);
      color: var(--gold-light);
      padding: 24px 16px 18px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    header h1 {
      font-size: 24px;
      letter-spacing: 3px;
      margin-bottom: 4px;
      font-weight: 300;
    }

    header h1 span {
      font-weight: 700;
    }

    header p {
      font-size: 11px;
      letter-spacing: 2px;
      opacity: 0.65;
      text-transform: uppercase;
    }

    .category-nav {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 70px;
      z-index: 99;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .category-nav::-webkit-scrollbar { display: none; }

    .category-nav button {
      flex-shrink: 0;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #fff;
      color: var(--text-light);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .category-nav button.active {
      background: var(--gold);
      color: #fff;
      border-color: var(--gold);
    }

    .category {
      margin: 12px 12px 0;
    }

    .category-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 14px 4px 8px;
      border-bottom: 2px solid var(--gold);
      margin-bottom: 8px;
    }

    .category-title h2 {
      font-size: 20px;
      color: var(--gold-dark);
    }

    .category-title span {
      font-size: 13px;
      color: var(--text-light);
      letter-spacing: 0.5px;
    }

    .category-note {
      font-size: 11px;
      color: var(--accent);
      padding: 0 4px 8px;
      font-style: italic;
    }

    .menu-item {
      display: flex;
      align-items: center;
      padding: 12px 10px;
      border-radius: 10px;
      margin-bottom: 2px;
      transition: all 0.2s ease;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .menu-item:active {
      transform: scale(0.99);
    }

    .menu-item.selected {
      background: var(--selected-bg);
      box-shadow: inset 0 0 0 1.5px var(--gold-light);
    }

    .menu-item input[type="checkbox"] {
      display: none;
    }

    .check-box {
      width: 22px;
      height: 22px;
      border: 2px solid #c8c0b4;
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      margin-right: 10px;
    }

    .menu-item.selected .check-box {
      background: var(--gold);
      border-color: var(--gold);
    }

    .check-box::after {
      content: '';
      display: none;
      width: 6px;
      height: 10px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-top: -2px;
    }

    .menu-item.selected .check-box::after {
      display: block;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-name-zh {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
    }

    .item-name-en {
      font-size: 11px;
      color: var(--text-light);
      line-height: 1.3;
    }

    .preorder-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      color: var(--preorder);
      background: rgba(184, 92, 47, 0.1);
      border: 1px solid rgba(184, 92, 47, 0.3);
      border-radius: 4px;
      padding: 1px 5px;
      margin-left: 4px;
      vertical-align: middle;
      letter-spacing: 0.5px;
    }

    .item-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--gold-dark);
      flex-shrink: 0;
      margin-left: 8px;
      white-space: nowrap;
    }

    .qty-control {
      display: none;
      align-items: center;
      gap: 6px;
      margin-left: 8px;
      flex-shrink: 0;
    }

    .menu-item.selected .qty-control {
      display: flex;
    }

    .qty-control button {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      background: #fff;
      color: var(--gold);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: all 0.15s;
    }

    .qty-control button:active {
      background: var(--gold);
      color: #fff;
    }

    .qty-control .qty-num {
      font-size: 15px;
      font-weight: 600;
      min-width: 22px;
      text-align: center;
    }

    .item-options {
      display: none;
      padding: 8px 0 4px 32px;
      animation: slideDown 0.2s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .menu-item.selected + .item-options {
      display: block;
    }

    .option-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }

    .option-group label {
      font-size: 11px;
      color: var(--text-light);
      margin-right: 2px;
    }

    .option-pill {
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      background: #fff;
      user-select: none;
    }

    .option-pill:active {
      transform: scale(0.95);
    }

    .option-pill.active {
      background: var(--gold);
      color: #fff;
      border-color: var(--gold);
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 200;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
    }

    .bottom-bar .summary {
      font-size: 13px;
    }

    .bottom-bar .summary .total {
      font-size: 22px;
      font-weight: 700;
      color: var(--gold-dark);
    }

    .bottom-bar .summary .count {
      font-size: 12px;
      color: var(--text-light);
    }

    .submit-btn {
      padding: 12px 28px;
      border: none;
      border-radius: 25px;
      background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 50%, var(--gold-light) 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(155, 123, 79, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    .submit-btn:active:not(:disabled) {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .note-text {
      text-align: center;
      padding: 16px 16px 8px;
      font-size: 11px;
      color: var(--text-light);
      line-height: 1.6;
    }

    .search-wrap {
      padding: 10px 12px;
      background: #fff;
    }

    .search-wrap input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background: var(--gold-bg);
      transition: border-color 0.2s;
    }

    .search-wrap input:focus {
      border-color: var(--gold);
      background: #fff;
    }

    .hidden { display: none !important; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 4px;
      opacity: 0.5;
    }
  </style>
</head>

  const nav = document.getElementById('categoryNav');
  MENU_DATA.forEach(cat => {
    const btn = document.createElement('button');
    btn.textContent = cat.zh;
    btn.dataset.id = cat.id;
    btn.addEventListener('click', () => {
      document.getElementById(`cat-${cat.id}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    nav.appendChild(btn);
  });
}

// Build menu
function buildMenu() {
  const container = document.getElementById('menuContainer');

  MENU_DATA.forEach(cat => {
    const section = document.createElement('section');
    section.className = 'category';
    section.id = `cat-${cat.id}`;

    let html = `
      <div class="category-title">
        <h2>${cat.zh}</h2>
        <span>${cat.en}</span>
      </div>
    `;

    if (cat.note) {
      html += `<div class="category-note">${cat.note}</div>`;
    }

    cat.items.forEach((item, idx) => {
      const key = `${cat.id}-${idx}`;
      const priceText = item.marketPrice ? '時價' : `$${item.price.toLocaleString()}`;
      const preorderTag = item.preorder ? '<span class="preorder-badge">預訂</span>' : '';

      html += `
        <div class="menu-item" data-key="${key}" onclick="toggleItem('${key}')">
          <input type="checkbox" id="cb-${key}">
          <div class="check-box"></div>
          <div class="item-info">
            <div class="item-name-zh">${item.zh}${preorderTag}</div>
            <div class="item-name-en">${item.en}</div>
          </div>
          <div class="item-price">${priceText}</div>
          <div class="qty-control" onclick="event.stopPropagation()">
            <button onclick="changeQty('${key}', -1)">−</button>
            <span class="qty-num" id="qty-${key}">1</span>
            <button onclick="changeQty('${key}', 1)">+</button>
          </div>
        </div>
      `;

      // Options (curry size, protein, cooking method, etc.)
      if (item.hasSize || item.options) {
        html += `<div class="item-options" id="opts-${key}">`;

        if (item.hasSize) {
          html += `
            <div class="option-group">
              <label>份量：</label>
              <span class="option-pill active" data-key="${key}" data-type="size" data-val="小份" data-price="${item.price}" onclick="selectOption(this)">小份 $${item.price}</span>
              <span class="option-pill" data-key="${key}" data-type="size" data-val="大份" data-price="${item.price + 300}" onclick="selectOption(this)">大份 $${item.price + 300}</span>
            </div>
          `;
        }

        if (item.options) {
          Object.entries(item.options).forEach(([type, values]) => {
            const labels = { protein: '選擇：', cooking: '做法：', style: '湯底：', sauce: '醬料：' };
            html += `<div class="option-group"><label>${labels[type] || ''}</label>`;
            values.forEach((v, i) => {
              html += `<span class="option-pill${i === 0 ? ' active' : ''}" data-key="${key}" data-type="${type}" data-val="${v}" onclick="selectOption(this)">${v}</span>`;
            });
            html += `</div>`;
          });
        }

        html += `</div>`;
      }

      // Add subtle divider between items (except last)
      if (idx < cat.items.length - 1) {
        html += `<div class="divider"></div>`;
      }
    });

    section.innerHTML = html;
    container.appendChild(section);
  });
}

function toggleItem(key) {
  const el = document.querySelector(`.menu-item[data-key="${key}"]`);

  if (state.selections[key]) {
    delete state.selections[key];
    el.classList.remove('selected');
  } else {
    const [catId, idx] = key.split('-');
    const cat = MENU_DATA.find(c => c.id === catId);
    const item = cat.items[parseInt(idx)];

    state.selections[key] = {
      qty: 1,
      size: item.hasSize ? '小份' : null,
      options: {},
      basePrice: item.price,
      effectivePrice: item.price,
    };

    // Set default options
    if (item.options) {
      Object.entries(item.options).forEach(([type, values]) => {
        state.selections[key].options[type] = values[0];
      });
    }

    el.classList.add('selected');
    document.getElementById(`qty-${key}`).textContent = '1';
  }

  updateTotal();
}

function changeQty(key, delta) {
  if (!state.selections[key]) return;
  const sel = state.selections[key];
  sel.qty = Math.max(1, Math.min(99, sel.qty + delta));
  document.getElementById(`qty-${key}`).textContent = sel.qty;
  updateTotal();
}

function selectOption(el) {
  const key = el.dataset.key;
  const type = el.dataset.type;
  const val = el.dataset.val;

  // Deselect siblings
  el.parentElement.querySelectorAll('.option-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');

  if (!state.selections[key]) return;

  if (type === 'size') {
    state.selections[key].size = val;
    state.selections[key].effectivePrice = parseInt(el.dataset.price);
  } else {
    state.selections[key].options[type] = val;
  }

  updateTotal();
}

function updateTotal() {
  let total = 0;
  let count = 0;
  let hasMarketPrice = false;

  Object.entries(state.selections).forEach(([key, sel]) => {
    const [catId, idx] = key.split('-');
    const cat = MENU_DATA.find(c => c.id === catId);
    const item = cat.items[parseInt(idx)];
    count += sel.qty;
    if (item.marketPrice) {
      hasMarketPrice = true;
    } else {
      total += sel.effectivePrice * sel.qty;
    }
  });

  document.getElementById('totalPrice').textContent = total.toLocaleString();
  document.getElementById('itemCount').textContent = `已選 ${count} 項`;
  document.getElementById('submitBtn').disabled = count === 0;
}

// Search
document.getElementById('searchInput').addEventListener('input', function() {
  const query = this.value.toLowerCase().trim();

  MENU_DATA.forEach(cat => {
    const section = document.getElementById(`cat-${cat.id}`);
    let hasVisible = false;

    cat.items.forEach((item, idx) => {
      const key = `${cat.id}-${idx}`;
      const el = section.querySelector(`.menu-item[data-key="${key}"]`);
      const opts = document.getElementById(`opts-${key}`);

      const match = !query ||
        item.zh.toLowerCase().includes(query) ||
        item.en.toLowerCase().includes(query);

      if (el) {
        el.classList.toggle('hidden', !match);
        if (opts && !match) opts.classList.add('hidden');
        else if (opts) opts.classList.remove('hidden');
      }
      if (match) hasVisible = true;
    });

    section.classList.toggle('hidden', !hasVisible);
  });
});

// Scroll spy for nav
function updateActiveNav() {
  const scrollY = window.scrollY + 140;
  let activeId = MENU_DATA[0].id;

  MENU_DATA.forEach(cat => {
    const el = document.getElementById(`cat-${cat.id}`);
    if (el && el.offsetTop <= scrollY) {
      activeId = cat.id;
    }
  });

  document.querySelectorAll('.category-nav button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.id === activeId);
    if (btn.dataset.id === activeId) {
      btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  });
}

window.addEventListener('scroll', updateActiveNav, { passive: true });

// Build order summary text
function buildOrderText() {
  const lines = ['\u{1F37D} Thai & Thai \u8A02\u55AE\n'];
  let total = 0;
  let hasMarketPrice = false;

  MENU_DATA.forEach(cat => {
    const catItems = [];

    cat.items.forEach((item, idx) => {
      const key = `${cat.id}-${idx}`;
      const sel = state.selections[key];
      if (!sel) return;

      // Build short English name (first few words)
      const shortEn = item.en.split(' ').slice(0, 4).join(' ');
      let line = `\u2022 ${item.zh} ${shortEn}`;

      // Options
      const optParts = [];
      if (sel.size) {
        optParts.push(sel.size);
      }
      Object.values(sel.options).forEach(v => optParts.push(v));
      if (optParts.length) line += ` (${optParts.join(', ')})`;

      if (sel.qty > 1) line += ` x${sel.qty}`;

      if (item.marketPrice) {
        line += ' - \u6642\u50F9';
        hasMarketPrice = true;
      } else {
        const subtotal = sel.effectivePrice * sel.qty;
        line += ` - $${subtotal.toLocaleString()}`;
        total += subtotal;
      }

      catItems.push(line);
    });

    if (catItems.length) {
      lines.push(`\u3010${cat.zh} ${cat.en}\u3011`);
      catItems.forEach(l => lines.push(l));
      lines.push('');
    }
  });

  lines.push(`\u{1F4B0} \u5C0F\u8A08 Subtotal\uFF1A$${total.toLocaleString()}`);
  if (hasMarketPrice) {
    lines.push('(\u6642\u50F9\u54C1\u9805\u53E6\u8A08)');
  }
  lines.push('(\u53E6\u52A010%\u670D\u52D9\u8CBB +10% service charge)');

  return lines.join('\n');
}

// LIFF init and submit
async function initLiff() {
  try {
    await liff.init({ liffId: '2009781079-2Xq4KZ5N' }); // Thai & Thai Menu LIFF
  } catch (e) {
    console.log('LIFF init failed, running in standalone mode');
  }
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  const orderText = buildOrderText();

  if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
    try {
      await liff.sendMessages([{ type: 'text', text: orderText }]);
      liff.closeWindow();
    } catch (e) {
      fallbackSubmit(orderText);
    }
  } else {
    fallbackSubmit(orderText);
  }
});

function fallbackSubmit(text) {
  navigator.clipboard.writeText(text).then(() => {
    alert('\u8A02\u55AE\u5DF2\u8907\u88FD\u5230\u526A\u8CBC\u7C3F\uFF01\nOrder copied to clipboard!\n\n\u8ACB\u8CBC\u4E0A\u50B3\u9001\u7D66\u5C0D\u65B9\u3002');
  }).catch(() => {
    prompt('\u8ACB\u8907\u88FD\u4EE5\u4E0B\u8A02\u55AE\u5167\u5BB9\uFF1A', text);
  });
}

// Init
buildNav();
buildMenu();
updateActiveNav();
initLiff();
</script>
